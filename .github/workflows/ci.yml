name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SAFEPAY_ENVIRONMENT: sandbox
      SAFEPAY_API_KEY: sec_placeholder
      SAFEPAY_V1_SECRET: placeholder
      SAFEPAY_WEBHOOK_SECRET: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run database migrations
        run: npm run db:generate && npm run db:migrate

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed test database
        run: npm run db:seed

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

  # Production deployment happens through Vercel's own GitHub integration
  # (connect the repo in the Vercel dashboard) rather than a step here —
  # see SETUP.md "Production deployment". This workflow's job is to make
  # sure nothing broken reaches main, not to deploy it.
